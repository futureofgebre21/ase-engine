[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ase"
version = "0.1.0"
description = "ASE - Autonomous Software Engineer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.30",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "modal>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", ".venv", "workspaces"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]
extend-exclude = ["tests/fixtures", "workspaces"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
